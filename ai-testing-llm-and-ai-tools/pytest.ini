[pytest]
testpaths = tests ai_tools
addopts = -v --html=reports/report.html --self-contained-html
markers =
    functional: expected answers for in-scope questions
    hallucination: grounding / unknown-question behaviour
    safety: prompt injection, data leakage, PII
    robustness: paraphrase, typos, long/empty/unicode input, consistency
    deepeval: LLM-as-judge metrics (needs a real LLM provider)
    ai_tools: self-healing / visual AI tools
